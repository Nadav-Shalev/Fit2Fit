name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running the workflow by hand from the Actions tab.
  workflow_dispatch:

# Grants the deployment job the token permissions Pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Lets an in-progress deployment finish rather than being cancelled by a new push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        # vite.config.ts derives the base path from GITHUB_REPOSITORY, so the
        # build works for any repository name without editing a file.
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
